stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: "latest"
  REGISTRY: "compse140.devops-gitlab.rd.tuni.fi:5050"
  DOCKER_DRIVER: "overlay2"

# Build stage: Builds the Docker images for service1 and service2
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker images for services..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$REGISTRY/service1:$IMAGE_TAG" ./service1
    - docker build -t "$REGISTRY/service2:$IMAGE_TAG" ./service2
    - echo "Pushing images to the GitLab Container Registry..."
    - docker push "$REGISTRY/service1:$IMAGE_TAG"
    - docker push "$REGISTRY/service2:$IMAGE_TAG"
  only:
    - main
  tags:
    - docker

# Test stage: Verifies the containers start and run correctly
test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Testing service1 and service2..."
    - docker pull "$REGISTRY/service1:$IMAGE_TAG"
    - docker pull "$REGISTRY/service2:$IMAGE_TAG"
    # Run test containers for service1 and service2
    - docker run -d --name test-service1 "$REGISTRY/service1:$IMAGE_TAG"
    - docker run -d --name test-service2 "$REGISTRY/service2:$IMAGE_TAG"
    - docker ps | grep test-service1
    - docker ps | grep test-service2
    # Stop and remove the test containers
    - docker stop test-service1 test-service2
    - docker rm test-service1 test-service2
  only:
    - main
  tags:
    - docker

# Deploy stage: Deploys the application using docker-compose
deploy:
  stage: deploy
  image: docker-compose:latest
  services:
    - docker:dind
  script:
    - echo "Deploying application with Docker Compose..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "Updating image references in docker-compose.yml..."
    - sed -i "s|JimiMN/service1:latest|$REGISTRY/service1:$IMAGE_TAG|g" docker-compose.yaml
    - sed -i "s|JimiMN/service2:latest|$REGISTRY/service2:$IMAGE_TAG|g" docker-compose.yaml
    # Bring down any existing services and deploy the updated stack
    - docker-compose down
    - docker-compose up -d
  only:
    - main
  tags:
    - docker
