image: docker:latest
services:
  - name: docker:24.0.5-dind  # Use specific version
    alias: docker  # Important: Explicitly set alias
    command: ["--tls=false"]  # Disable TLS

variables:
  # Use IP instead of hostname
  DOCKER_HOST: tcp://127.0.0.1:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - test

test:
  stage: test
  script:
    # Network and DNS debugging
    - apk add --no-cache bind-tools
    - cat /etc/resolv.conf
    - nslookup docker
    - ip addr
    
    # Docker network configuration
    - docker network create compse140_my_network || true
    
    # Verbose Docker and Compose commands
    - docker-compose config  # Validate compose file
    - docker-compose up -d --force-recreate
    
    # Extended service initialization
    - sleep 20
    
    # Network and service diagnostics
    - docker ps
    - docker network inspect compse140_my_network
    
    # Test execution
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r tests/requirements.txt
    - PYTHONPATH=. pytest tests/ -v
  
  after_script:
    - docker-compose down