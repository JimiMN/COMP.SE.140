image: docker:24.0.5
services:
  - name: docker:24.0.5-dind
    # Critical: Use IP instead of hostname
    command: 
      - --tls=false
      - --host=tcp://0.0.0.0:2375

variables:
  # Explicitly use TCP connection without hostname
  DOCKER_HOST: tcp://127.0.0.1:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - test

test:
  stage: test
  before_script:
  - apk add --no-cache python3 py3-pip  # Ensure Python is installed
  script:
    # Advanced network debugging
    - apk add --no-cache bind-tools net-tools

    # Comprehensive network investigation
    - echo "Network Interfaces:"
    - ip addr
    
    - echo "Attempting manual DNS configuration:"
    - |
      echo "nameserver 1.1.1.1" > /etc/resolv.conf
      echo "nameserver 8.8.8.8" >> /etc/resolv.conf
    
    # Docker network creation with IP-based communication
    - docker network create compse140_my_network || true
    
    # Use IP-based Docker commands
    - docker -H tcp://127.0.0.1:2375 network ls
    
    # Verbose Docker Compose operations
    - docker-compose config
    
    # Force network recreation
    - docker-compose up -d --force-recreate
    
    # Extended initialization
    - sleep 30
    
    # Comprehensive diagnostics
    - docker network inspect compse140_my_network
    
    # Test execution
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r tests/requirements.txt
    - PYTHONPATH=. pytest tests/ -v
  
  after_script:
    - docker-compose down