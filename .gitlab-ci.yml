image: docker:latest
services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_NETWORK: compse140_my_network  # Explicitly define network

stages:
  - test
  - build
  - deploy

before_script:
  - apk add --no-cache docker-compose python3 py3-pip

test:
  stage: test
  script:
    - docker-compose up -d
    - sleep 15  # Extended initialization time
    
    # Detailed network and service diagnostics
    - docker network ls
    - docker-compose ps
    - docker network inspect compse140_my_network
    
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r tests/requirements.txt pytest requests
    
    # Enhanced test running with network debugging
    - |
      PYTHONPATH=. pytest tests/ --cache-clear -v \
        --log-cli-level=DEBUG \
        --capture=no
  after_script:
    - docker-compose down