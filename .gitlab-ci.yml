image: docker:24.0.5
services:
  - name: docker:24.0.5-dind
    alias: dockerhost  # Changed from 'docker'
    command: ["--tls=false"]

variables:
  # Explicitly use IP and alias
  DOCKER_HOST: tcp://dockerhost:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - test

test:
  stage: test
  script:
    # Advanced network diagnostics
    - apk add --no-cache bind-tools net-tools
    
    # Comprehensive network investigation
    - echo "Network Interfaces:"
    - ip addr
    
    - echo "DNS Configuration:"
    - cat /etc/resolv.conf
    
    - echo "Attempting manual hostname resolution:"
    - nslookup dockerhost || true
    
    # Add explicit DNS resolution
    - echo "nameserver 8.8.8.8" | tee /etc/resolv.conf
    
    # Network creation with explicit configuration
    - docker network create compse140_my_network || true
    
    # Verbose Docker Compose operations
    - docker-compose config
    - docker-compose up -d --force-recreate
    
    # Extended initialization
    - sleep 30
    
    # Comprehensive service and network diagnostics
    - docker ps
    - docker network inspect compse140_my_network
    
    # Test execution with network debugging
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r tests/requirements.txt
    - PYTHONPATH=. pytest tests/ -v
  
  after_script:
    - docker-compose down