image: docker:latest  # Use Docker as the base image

services:
  - docker:dind  # Start a Docker-in-Docker service

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - test
  - build
  - deploy

before_script:
  - apk add --no-cache docker-compose  # Install docker-compose

test:
  stage: test
  script:
    - docker-compose up -d  # Start services
    - docker ps  # List running containers
    - docker-compose exec -T app pytest  # Example test command
    - docker-compose down  # Stop services

build:
  stage: build
  script:
    - docker-compose build

deploy:
  stage: deploy
  script:
    - docker-compose up -d

