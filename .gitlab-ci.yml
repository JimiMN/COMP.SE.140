image: docker:latest  # Use Docker as the base image

services:
  - docker:dind  # Start a Docker-in-Docker service

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - test
  - build
  - deploy

before_script:
  - apk add --no-cache docker-compose  # Install docker-compose

test:
  stage: test
  before_script:
    - apk add --no-cache python3 py3-pip  # Ensure Python is installed
    - pip install -r tests/requirements.txt
  script:
    - docker-compose up -d  # Start services
    - sleep 5  # Ensure services are up
    - pytest tests/  # Run tests
  after_script:
    - docker-compose down # Shutdown


build:
  stage: build
  script:
    - docker-compose build

deploy:
  stage: deploy
  script:
    - docker-compose up -d

