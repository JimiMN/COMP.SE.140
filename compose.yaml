networks:
  default:
    name: compse140_my_network
    driver: bridge
    labels:
      com.docker.compose.network: "compse140_my_network"
      com.docker.compose.project: "compse140"

services:
  service1-1:
    build:
      context: ./service1
    image: jimimn/service1:latest
    depends_on:
      - service2
    networks:
      - default

  service1-2:
    build:
      context: ./service1
    image: jimimn/service1:latest
    depends_on:
      - service2
    networks:
      - default

  service1-3:
    build:
      context: ./service1
    image: jimimn/service1:latest
    depends_on:
      - service2
    networks:
      - default

  service2:
    build:
      context: ./service2
    image: jimimn/service2:latest
    ports:
      - "3000:3000"
    networks:
      - default

  nginx:
    image: nginx:latest
    ports:
      - "8198:80"
    depends_on:
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - default
 
  api-gateway:
    build:
      context: ./api_gateway
    image: jimimn/api-gateway:latest
    ports:
      - "8197:8197"
    depends_on:
      - nginx
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

  test-runner:
    image: python:3.12
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - default
    depends_on:
      - api-gateway
    command: /bin/sh -c "pip install pytest && pytest tests/ --cache-clear"  # Install pytest before running tests