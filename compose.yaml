networks:
  my_network:
    driver: bridge

services:
  service1-1:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2
    networks:
      - my_network

  service1-2:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2
    networks:
      - my_network

  service1-3:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2
    networks:
      - my_network

  service2:
    build:
      context: ./service2
    image: JimiMN/service2:latest
    ports:
      - "3000:3000"
    networks:
      - my_network

  nginx:
    image: nginx:latest
    ports:
      - "8198:80"
    depends_on:
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - my_network
 
  api-gateway:
    build:
      context: ./api_gateway
    image: JimiMN/api-gateway:latest
    ports:
      - "8197:8197"
    depends_on:
      - nginx
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - my_network

  test-runner:
    image: python:3.12
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - my_network
    depends_on:
      - api-gateway
    command: /bin/sh -c "pip install pytest && pytest tests/ --cache-clear"  # Install pytest before running tests