services:
  service1-1:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2

  service1-2:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2

  service1-3:
    build:
      context: ./service1
    image: JimiMN/service1:latest
    depends_on:
      - service2

  service2:
    build:
      context: ./service2
    image: JimiMN/service2:latest
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    ports:
      - "8198:80"
    depends_on:
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./nginx/html:/usr/share/nginx/html
 
  api-gateway:
    build:
      context: ./api_gateway  # Assuming your Flask app is in ./api-gateway directory
    image: JimiMN/api-gateway:latest
    ports:
      - "8197:8197"  # Exposes the Flask app at port 8197
    depends_on:
      - nginx
      - service1-1
      - service1-2
      - service1-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock