events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream service1 {
        server service1-1:5000;
        server service1-2:5000;
        server service1-3:5000;
    }

    server {
        listen 80;

        # Serve static files (index.html)
        location / {
            root /usr/share/nginx/html;  # Path where your HTML files will be served
            index index.html;  # Ensure index.html is the default file
        }

        # Handle /request endpoint by forwarding it to one of the service1 instances (load balancing)
        location /request {
            proxy_pass http://service1;  # Pointing to the 'service1' upstream for load balancing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Basic Authentication (if enabled)
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;  # Path to your htpasswd file
    }
}
